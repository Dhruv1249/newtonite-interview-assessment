version: "3.8"

services:
  flashdrop-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flashdrop-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=flashdrop=info,tower_http=info
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://flashdrop:flashdrop_secret@postgres:5432/flashdrop
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flashdrop-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: flashdrop-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flashdrop
      POSTGRES_PASSWORD: flashdrop_secret
      POSTGRES_DB: flashdrop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashdrop -d flashdrop"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
